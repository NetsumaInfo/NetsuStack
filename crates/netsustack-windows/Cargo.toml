[package]
name = "netsustack-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "ansi-terminal-fixture"
path = "../../fixtures/ansi-terminal/src/main.rs"

[[bin]]
name = "child-tree-fixture"
path = "../../fixtures/child-tree/src/main.rs"

[[bin]]
name = "port-reuse-fixture"
path = "../../fixtures/port-reuse/src/main.rs"

[[bin]]
name = "docker-cli-fixture"
path = "../../fixtures/docker-cli/src/main.rs"

[[bin]]
name = "docker-pipe-probe"
path = "../../fixtures/docker-pipe-probe/src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = "3"
